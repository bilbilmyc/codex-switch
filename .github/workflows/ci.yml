name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the tag to match the V2 package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(cargo metadata --manifest-path v2/src-tauri/Cargo.toml --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "codex-switch-v2") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Require V2 package versions to agree
        shell: bash
        run: |
          cargo_version="$(cargo metadata --manifest-path v2/src-tauri/Cargo.toml --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "codex-switch-v2") | .version')"
          tauri_version="$(jq -er '.version' v2/src-tauri/tauri.conf.json)"
          frontend_version="$(jq -er '.version' v2/frontend/package.json)"
          test "$cargo_version" = "$tauri_version"
          test "$cargo_version" = "$frontend_version"

  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            v2/src-tauri -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check V2 Tauri formatting
        run: cargo fmt --manifest-path v2/src-tauri/Cargo.toml -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Check V2 Tauri shell
        run: cargo check --manifest-path v2/src-tauri/Cargo.toml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build

  package-v2:
    name: Package V2 (${{ matrix.name }})
    needs: [check, frontend, validate-release-version]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Keep the .app available for architecture and signature checks.
            bundle: app,dmg
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            package_glob: v2/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundle: nsis
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            package_glob: v2/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/frontend/pnpm-lock.yaml
      - name: Install V2 frontend dependencies
        working-directory: v2/frontend
        run: pnpm install --frozen-lockfile
      - name: Build V2 native installer
        working-directory: v2/src-tauri
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify Windows GUI executables
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -LiteralPath v2/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          ./scripts/check_windows_subsystem.ps1 -Path @('v2/src-tauri/target/x86_64-pc-windows-msvc/release/codex-switch.exe', $installer[0].FullName)
      - name: Verify macOS universal app and disk image
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          app="v2/src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Switch.app"
          lipo "$app/Contents/MacOS/codex-switch" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify ${{ matrix.package_glob }}
      - name: Upload V2 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-switch-${{ matrix.name }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error

  publish-release:
    name: Publish Windows and macOS release
    needs: [package-v2]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-switch-*
          path: release
          merge-multiple: true
      - name: Require both platform installers
        shell: bash
        run: |
          shopt -s nullglob
          windows=(release/*-setup.exe)
          macos=(release/*_universal.dmg)
          test "${#windows[@]}" -eq 1
          test "${#macos[@]}" -eq 1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            release/*-setup.exe
            release/*_universal.dmg
          fail_on_unmatched_files: true
